services:
  # ---------------------------------------------------------------------------
  # 1. NestJS REST API (Public Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: pulsewatch-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter # or free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        fromRedis:
          name: pulsewatch-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: WEB_ORIGIN
        value: https://pulsewatch-kohl.vercel.app

  # ---------------------------------------------------------------------------
  # 2. Monitoring Scheduler (Background Worker Daemon)
  # ---------------------------------------------------------------------------
  - type: worker
    name: pulsewatch-scheduler
    runtime: docker
    dockerfilePath: apps/scheduler/Dockerfile
    dockerContext: .
    plan: starter # Background workers on Render require Starter ($7/mo)
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromRedis:
          name: pulsewatch-redis
          property: connectionString
      - key: SCHEDULER_POLL_INTERVAL_MS
        value: 5000
      - key: SCHEDULER_BATCH_SIZE
        value: 500

  # ---------------------------------------------------------------------------
  # 3. Monitoring Prober & Slack Alert Worker (Background Worker Daemon)
  # ---------------------------------------------------------------------------
  - type: worker
    name: pulsewatch-worker
    runtime: docker
    dockerfilePath: apps/worker/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromRedis:
          name: pulsewatch-redis
          property: connectionString
      - key: SLACK_WEBHOOK_URL
        sync: false

# ---------------------------------------------------------------------------
# 4. Redis Queue Instance
# ---------------------------------------------------------------------------
redis:
  - name: pulsewatch-redis
    plan: free # Render provides free Redis for 30 days or persistent low-cost instance
    ipAllowList: [] # internal only
