services:
  # ---------------------------------------------------------------------------
  # 1. Express REST API Backend (Includes Embedded Scheduler & Probe Worker)
  # ---------------------------------------------------------------------------
  - type: web
    name: pulsewatch-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4001
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: ENABLE_EMBEDDED_WORKERS
        value: "true"
      - key: SLACK_WEBHOOK_URL
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Next.js Web Frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: pulsewatch-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        sync: false
