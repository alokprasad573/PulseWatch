services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Relational Database (Internal standalone service)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: pulsewatch-postgres
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pulsewatch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pulsewatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsewatch-network

  # ---------------------------------------------------------------------------
  # 2. Redis Message & Job Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pulsewatch-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsewatch-network

  # ---------------------------------------------------------------------------
  # 3. Express.js REST API Backend (MVC)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pulsewatch-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-4001}:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/pulsewatch?schema=public}
      - DIRECT_URL=${DIRECT_URL:-postgresql://postgres:postgres@postgres:5432/pulsewatch?schema=public}
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-pulsewatch_super_secret_jwt_access_token_32chars}
      - REFRESH_TOKEN_PEPPER=${REFRESH_TOKEN_PEPPER:-pulsewatch_super_secret_refresh_pepper_32chars}
      - WEB_ORIGIN=${WEB_ORIGIN:-${CORS_ORIGIN:-http://localhost:3000}}
      - ENABLE_EMBEDDED_WORKERS=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pulsewatch-network

  # ---------------------------------------------------------------------------
  # 4. Monitoring Scheduler Daemon
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    container_name: pulsewatch-scheduler
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/pulsewatch?schema=public}
      - REDIS_URL=redis://redis:6379
      - SCHEDULER_POLL_INTERVAL_MS=${SCHEDULER_POLL_INTERVAL_MS:-5000}
      - SCHEDULER_BATCH_SIZE=${SCHEDULER_BATCH_SIZE:-500}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - pulsewatch-network

  # ---------------------------------------------------------------------------
  # 5. Monitoring Execution & Probe Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: pulsewatch-worker
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/pulsewatch?schema=public}
      - REDIS_URL=redis://redis:6379
      - MONITOR_WORKER_CONCURRENCY=${MONITOR_WORKER_CONCURRENCY:-10}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - pulsewatch-network

  # ---------------------------------------------------------------------------
  # 6. Next.js Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4001/api/v1}
    container_name: pulsewatch-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4001/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pulsewatch-network

networks:
  pulsewatch-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
